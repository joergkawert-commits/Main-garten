<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#1e3a1e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mein Garten" />
<link rel="manifest" href="/Main-garten/manifest.json" />
<link rel="apple-touch-icon" href="/Main-garten/icon-192.png" />
<title>Mein Garten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* Grüntöne */
    --g-deep:   #1e3a1e;
    --g-forest: #2d5a2d;
    --g-sage:   #4a7c4a;
    --g-moss:   #6b9e6b;
    --g-fern:   #a8c8a8;
    --g-mist:   #d4e8d4;
    /* Erdtöne */
    --e-clay:   #8b5e3c;
    --e-sand:   #c4a882;
    /* Hintergründe */
    --c-bg:         #f5f0e8;
    --c-bg-card:    #faf7f0;
    --c-bg-linen:   #ede8dc;
    /* Text */
    --c-ink:        #1e2a1e;
    --c-ink-soft:   #3d4e3d;
    --c-ink-mute:   #7a8a7a;
    /* Linien */
    --c-line:       #d8d0c0;
    --c-line-strong:#c4b89a;
    --c-line-g:     #b8d0b8;
    /* Funktional */
    --c-leaf:       #2d5a2d;
    --c-danger:     #a83232;
    --c-warn-bg:    #fff4dc;
    --c-warn-bd:    #e6c577;
    --c-warn-ink:   #6b4a14;
    /* Radien */
    --r-md: 14px;
    --r-lg: 18px;
    /* Abstände */
    --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;
    --s-5:24px;--s-6:32px;--s-7:48px;
    /* Schatten */
    --shadow-sm: 0 1px 3px rgba(30,42,30,0.06), 0 1px 0 rgba(30,42,30,0.03);
    --shadow-md: 0 4px 16px rgba(30,42,30,0.10);
    --shadow-lg: 0 12px 40px rgba(30,42,30,0.18);
    /* Fonts */
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body:    'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
    /* Safe Areas */
    --safe-top:    env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    color: var(--c-ink);
    background: var(--c-bg);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3 { font-family: var(--font-display); font-weight: 500; margin: 0; }
  h1 { font-size: 28px; } h2 { font-size: 22px; } h3 { font-size: 18px; }
  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: 16px; }

  /* ---- Auth Screen ---- */
  #authScreen {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: var(--s-5);
    padding-top: calc(var(--safe-top) + var(--s-5));
    background: var(--g-deep);
    background-image: radial-gradient(ellipse at 30% 20%, rgba(45,90,45,0.4) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(139,94,60,0.2) 0%, transparent 60%);
  }
  .auth-card {
    width: 100%; max-width: 380px;
    background: var(--c-bg-card);
    border: 1px solid var(--c-line);
    border-radius: 24px;
    padding: var(--s-6) var(--s-5);
    box-shadow: var(--shadow-lg);
  }
  .auth-logo {
    font-family: var(--font-display);
    font-size: 32px;
    color: var(--g-forest);
    margin-bottom: var(--s-1);
  }
  .auth-tagline { font-size: 14px; color: var(--c-ink-mute); margin-bottom: var(--s-6); }
  .auth-card h2 { margin-bottom: var(--s-2); }
  .auth-card p { color: var(--c-ink-soft); font-size: 15px; margin: 0 0 var(--s-4); }
  .auth-input {
    width: 100%; padding: 14px;
    border: 1px solid var(--c-line-strong);
    border-radius: var(--r-md);
    background: var(--c-bg);
    color: var(--c-ink);
    outline: none;
    margin-bottom: var(--s-3);
    box-sizing: border-box;
  }
  .auth-input:focus { border-color: var(--g-forest); }
  .date-selects { display: grid; grid-template-columns: 2fr 3fr 3fr; gap: 8px; }
  .auth-btn {
    width: 100%; padding: 14px;
    border-radius: var(--r-md);
    border: none;
    background: var(--g-forest);
    color: white;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .auth-btn:active { transform: scale(0.98); }
  .auth-btn:disabled { opacity: 0.6; cursor: default; }

  .banner-warn {
    background: var(--c-warn-bg);
    border: 1px solid var(--c-warn-bd);
    color: var(--c-warn-ink);
    padding: var(--s-3) var(--s-4);
    border-radius: var(--r-md);
    font-size: 14px;
    margin-bottom: var(--s-3);
  }
  .spinner {
    width: 24px; height: 24px;
    border: 3px solid var(--c-line);
    border-top-color: var(--g-forest);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto var(--s-3);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- App Shell ---- */
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: 0; z-index: 40;
    padding: calc(var(--safe-top) + var(--s-3)) var(--s-4) var(--s-3);
    background: var(--g-deep);
    display: flex; align-items: center; gap: var(--s-3);
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .topbar__title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 500;
    flex: 1;
    color: #fff;
    letter-spacing: 0.01em;
  }
  .topbar__title span { color: var(--g-fern); }
  .topbar__user {
    font-size: 11px;
    color: var(--g-moss);
    max-width: 130px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .iconbtn {
    width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: transparent;
    border-radius: var(--r-md);
    color: var(--g-fern);
    font-size: 22px;
  }
  .iconbtn:active { background: rgba(255,255,255,0.1); }

  main {
    flex: 1;
    padding: var(--s-4);
    padding-bottom: calc(var(--s-7) + var(--safe-bottom));
    max-width: 720px; width: 100%; margin: 0 auto;
  }

  /* ---- Drawer ---- */
  .drawer-scrim {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,20,10,0.65);
    opacity: 0; pointer-events: none;
    transition: opacity 180ms ease; z-index: 50;
  }
  .drawer-scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: 82%; max-width: 320px;
    background: var(--g-deep);
    transform: translateX(-100%);
    transition: transform 220ms cubic-bezier(0.2,0.8,0.2,1);
    z-index: 51; display: flex; flex-direction: column;
    padding-top: var(--safe-top);
    box-shadow: var(--shadow-lg);
  }
  .drawer.open { transform: translateX(0); }
  .drawer__brand {
    padding: var(--s-5) var(--s-5) var(--s-3);
    font-family: var(--font-display);
    font-size: 24px;
    color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .drawer__brand em { color: var(--g-fern); font-style: normal; }
  .drawer__brand small {
    display: block;
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--g-moss);
    margin-top: 3px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .drawer__user {
    padding: var(--s-3) var(--s-5);
    font-size: 13px;
    color: var(--g-moss);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .drawer__nav { padding: var(--s-2) 0; flex: 1; overflow-y: auto; }
  .drawer__item {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-3) var(--s-5);
    color: rgba(255,255,255,0.7);
    text-decoration: none; background: transparent; border: none;
    width: 100%; text-align: left;
    font-size: 16px; font-weight: 400;
    border-left: 3px solid transparent;
  }
  .drawer__item:active { background: rgba(255,255,255,0.05); }
  .drawer__item.active {
    color: #fff;
    font-weight: 700;
    background: rgba(74,124,74,0.18);
    border-left-color: var(--g-fern);
    padding-left: calc(var(--s-5) - 3px);
  }
  .drawer__item--danger { color: rgba(255,120,120,0.8); }

  /* ---- Sections / Cards ---- */
  .section-title {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--c-ink-mute);
    margin: var(--s-5) 0 var(--s-3);
    display: flex; align-items: center; gap: var(--s-3);
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px; background: var(--c-line);
  }
  .card {
    background: var(--c-bg-card);
    border: 1px solid var(--c-line);
    border-radius: var(--r-lg);
    padding: var(--s-4);
    box-shadow: var(--shadow-sm);
  }

  /* ---- Hero ---- */
  .hero { margin-top: var(--s-2); margin-bottom: var(--s-4); }
  .hero__greeting {
    font-family: var(--font-display);
    font-size: 32px;
    line-height: 1.1;
    color: var(--c-ink);
    margin-bottom: var(--s-1);
  }
  .hero__greeting em { font-style: italic; color: var(--g-forest); }
  .hero__date { color: var(--c-ink-mute); font-size: 14px; }

  /* ---- Wetter ---- */
  .weather-outer {
    background: var(--g-deep);
    border-radius: var(--r-lg);
    padding: var(--s-4) var(--s-5);
    display: flex; align-items: center; gap: var(--s-4);
    margin-bottom: var(--s-2);
    box-shadow: var(--shadow-md);
    position: relative; overflow: hidden;
  }
  .weather-outer::before {
    content: '';
    position: absolute; top: -30px; right: -30px;
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgba(74,124,74,0.25) 0%, transparent 70%);
  }
  .weather-card { display: flex; align-items: center; gap: var(--s-4); width: 100%; }
  .weather-card__icon { font-size: 42px; line-height: 1; flex-shrink: 0; }
  .weather-card__temp {
    font-family: var(--font-display);
    font-size: 44px; font-weight: 400; line-height: 1;
    color: #fff;
  }
  .weather-card__details { flex: 1; }
  .weather-card__desc { color: var(--g-fern); font-size: 14px; }
  .weather-card__minmax { color: rgba(255,255,255,0.45); font-size: 12px; margin-top: 2px; }
  .weather-card__loading { font-size: 13px; color: var(--c-ink-mute); font-style: italic; }
  .frost-banner {
    background: #fff4e0;
    border: 1px solid #e6b84a;
    color: #5a3a00;
    padding: var(--s-3) var(--s-4);
    border-radius: var(--r-md);
    font-size: 14px; margin-top: var(--s-3);
  }
  .frost-banner strong { color: #7a4f00; }

  /* ---- Schnellzugriff ---- */
  .quick-grid {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
    margin-bottom: var(--s-4);
  }
  .quick-card {
    background: var(--c-bg-card);
    border: 1px solid var(--c-line);
    border-radius: var(--r-lg);
    padding: 14px 10px;
    text-align: center;
    text-decoration: none; color: inherit;
    display: block;
    position: relative; overflow: hidden;
  }
  .quick-card:active { transform: scale(0.97); }
  .quick-card::after {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 0; height: 3px;
  }
  .quick-card--pflanzen::after { background: var(--g-forest); }
  .quick-card--beet::after     { background: var(--e-clay); }
  .quick-card--tagebuch::after { background: var(--g-sage); }
  .quick-card__icon { font-size: 28px; margin-bottom: 6px; }
  .quick-card__name { font-size: 12px; font-weight: 700; color: var(--c-ink); }
  .quick-card__meta { font-size: 11px; color: var(--c-ink-mute); margin-top: 2px; }

  /* ---- Pflanzenliste ---- */
  .search { position: relative; margin-bottom: var(--s-3); }
  .search input {
    width: 100%;
    padding: var(--s-3) var(--s-3) var(--s-3) var(--s-3);
    border: 1px solid var(--c-line-strong);
    border-radius: var(--r-md);
    background: var(--c-bg-card);
    color: var(--c-ink); outline: none;
  }
  .search input:focus { border-color: var(--g-forest); }
  .plant-grid { display: grid; gap: var(--s-2); }
  .plant-card {
    background: var(--c-bg-card);
    border: 1px solid var(--c-line);
    border-radius: var(--r-lg);
    padding: var(--s-3) var(--s-4);
    display: flex; align-items: center; gap: var(--s-3);
    text-decoration: none; color: inherit;
  }
  .plant-card:active { transform: scale(0.99); }
  .plant-card__emoji {
    font-size: 28px; width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    background: var(--g-mist);
    border: 1px solid var(--c-line-g);
    border-radius: 14px; flex-shrink: 0;
  }
  .plant-card__body { flex: 1; min-width: 0; }
  .plant-card__name {
    font-family: var(--font-display);
    font-size: 18px; font-weight: 400;
    color: var(--c-ink);
  }
  .plant-card__meta {
    font-size: 12px; color: var(--c-ink-mute);
    margin-top: 1px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
    font-style: italic;
  }
  .plant-card__chev { color: var(--c-ink-mute); font-size: 18px; }
  .empty { text-align: center; padding: var(--s-7) var(--s-4); color: var(--c-ink-mute); }
  .empty h3 { color: var(--c-ink); margin-bottom: var(--s-2); }

  /* ---- FAB ---- */
  .fab {
    position: fixed; right: var(--s-4);
    bottom: calc(var(--s-4) + var(--safe-bottom));
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--g-forest);
    color: white; border: none; font-size: 30px; line-height: 1;
    box-shadow: 0 4px 20px rgba(45,90,45,0.45);
    z-index: 30;
  }
  .fab:active { transform: scale(0.93); }

  /* ---- Detail ---- */
  .detail-head {
    background: var(--g-deep);
    margin: calc(-1 * var(--s-4)) calc(-1 * var(--s-4)) var(--s-4);
    padding: var(--s-5) var(--s-4) var(--s-5);
    display: flex; align-items: center; gap: var(--s-4);
  }
  .detail-head__emoji {
    font-size: 48px; width: 72px; height: 72px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; flex-shrink: 0;
  }
  .detail-head__title h1 { font-size: 26px; line-height: 1.1; color: #fff; }
  .detail-head__title em {
    font-style: italic; color: var(--g-fern);
    font-size: 13px; font-family: var(--font-display);
  }
  .props { list-style: none; padding: 0; margin: 0; }
  .props li {
    display: flex; justify-content: space-between; gap: var(--s-3);
    padding: var(--s-3) 0;
    border-bottom: 1px solid var(--c-line);
    font-size: 15px;
  }
  .props li:last-child { border-bottom: none; }
  .props li .k { color: var(--c-ink-mute); flex-shrink: 0; font-size: 14px; }
  .props li .v { text-align: right; color: var(--c-ink); font-weight: 700; }
  .props li .v.empty { color: var(--c-ink-mute); font-style: italic; font-weight: 400; }
  .pflege-text { white-space: pre-wrap; color: var(--c-ink); line-height: 1.6; font-size: 15px; }
  .pflege-text.empty { color: var(--c-ink-mute); font-style: italic; }
  .tags { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .tag {
    display: inline-block; padding: 4px 12px;
    border-radius: 999px;
    background: var(--g-mist);
    border: 1px solid var(--c-line-g);
    font-size: 13px; color: var(--g-forest);
  }
  .detail-actions { display: flex; gap: var(--s-3); margin-top: var(--s-5); }

  /* ---- Tagebuch ---- */
  .tagebuch-eintrag { padding: var(--s-3) 0; border-bottom: 1px solid var(--c-line); }
  .tagebuch-eintrag:last-child { border-bottom: none; }
  .tagebuch-eintrag__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .tagebuch-eintrag__datum { font-size: 12px; color: var(--c-ink-mute); font-weight: 700; letter-spacing: 0.04em; }
  .tagebuch-eintrag__actions { display: flex; gap: var(--s-2); }
  .tagebuch-eintrag__text { font-size: 15px; line-height: 1.55; white-space: pre-wrap; }
  .link-btn { background: none; border: none; color: var(--g-forest); font-size: 13px; padding: 2px 4px; cursor: pointer; }
  .link-btn--danger { color: var(--c-danger); }

  /* ---- Buttons ---- */
  .btn {
    padding: 13px 20px;
    border-radius: var(--r-md);
    border: 1px solid transparent;
    background: var(--g-forest);
    color: white; font-weight: 700; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; letter-spacing: 0.02em;
  }
  .btn:active { transform: scale(0.98); }
  .btn--ghost { background: transparent; color: var(--c-ink); border-color: var(--c-line-strong); font-weight: 400; }
  .btn--danger { background: transparent; color: var(--c-danger); border-color: var(--c-danger); font-weight: 400; }
  .btn--sm { padding: 8px 14px; font-size: 14px; }

  /* ---- Form ---- */
  .form { display: flex; flex-direction: column; gap: var(--s-4); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 700; color: var(--c-ink-mute); text-transform: uppercase; letter-spacing: 0.06em; }
  .field input,.field textarea,.field select {
    padding: 13px;
    border: 1px solid var(--c-line-strong);
    border-radius: var(--r-md);
    background: var(--c-bg-card);
    color: var(--c-ink); outline: none;
  }
  .field input:focus,.field textarea:focus,.field select:focus { border-color: var(--g-forest); }
  .field textarea { min-height: 100px; resize: vertical; }
  .field-hint { font-size: 12px; color: var(--c-ink-mute); }
  .field-group { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
  .field-group--3 { grid-template-columns: 1fr 1fr 1fr; }
  fieldset { border: 1px solid var(--c-line); border-radius: var(--r-md); padding: var(--s-3) var(--s-4); margin: 0; }
  fieldset legend { font-size: 12px; font-weight: 700; color: var(--c-ink-mute); padding: 0 var(--s-2); text-transform: uppercase; letter-spacing: 0.06em; }
  .tristate { display: flex; gap: var(--s-2); }
  .tristate button {
    flex: 1; padding: 10px;
    background: var(--c-bg-card);
    border: 1px solid var(--c-line-strong);
    border-radius: var(--r-md);
    color: var(--c-ink-mute); font-size: 14px;
  }
  .tristate button.active { background: var(--g-forest); color: white; border-color: var(--g-forest); }

  /* ---- Modal ---- */
  .modal-scrim {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,20,10,0.6);
    display: flex; align-items: flex-end; justify-content: center; z-index: 60;
  }
  .modal {
    background: var(--c-bg-card);
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: 480px;
    padding: var(--s-5) var(--s-4) calc(var(--s-4) + var(--safe-bottom));
    box-shadow: var(--shadow-lg); overflow: hidden;
  }
  .modal h2 { margin-bottom: var(--s-2); }
  .modal p { color: var(--c-ink-soft); margin: 0 0 var(--s-4); }
  .modal__actions { display: flex; gap: var(--s-3); }
  .modal__actions .btn { flex: 1; }

  /* ---- Toast ---- */
  .toast {
    position: fixed; left: 50%;
    bottom: calc(var(--s-5) + var(--safe-bottom));
    transform: translateX(-50%);
    background: var(--g-deep);
    color: white; padding: 12px 20px;
    border-radius: var(--r-md); font-size: 14px;
    box-shadow: var(--shadow-lg); z-index: 70;
    border: 1px solid rgba(255,255,255,0.1);

const firebaseConfig={

// ---- Helfer ----
function uuid(){
  if(typeof crypto!=="undefined"&&typeof crypto.randomUUID==="function")return crypto.randomUUID();
  return"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==="x"?r:(r&0x3)|0x8).toString(16);});
}
function heute(){
  var d=new Date(),m=String(d.getMonth()+1),t=String(d.getDate());
  if(m.length<2)m="0"+m;if(t.length<2)t="0"+t;

}
function formatDatum(iso){if(!iso)return"";var p=iso.split("-");return p[2]+"."+p[1]+"."+p[0];}
function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs){for(var k in attrs){if(!Object.prototype.hasOwnProperty.call(attrs,k))continue;var v=attrs[k];
    if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;
    else if(k.indexOf("on")===0&&typeof v==="function")e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,"");else if(v===false||v==null){}else e.setAttribute(k,v);}}
  if(children!=null){if(Object.prototype.toString.call(children)!=="[object Array]")children=[children];
    for(var i=0;i<children.length;i++){var c=children[i];if(c==null||c===false)continue;e.appendChild(typeof c==="string"?document.createTextNode(c):c);}}
  return e;
}

function toast(msg,ms){if(ms==null)ms=2200;var root=document.getElementById("toastRoot");clear(root);var t=el("div",{"class":"toast"},msg);root.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},ms);}

// ---- Konstanten ----
var KATEGORIEN=["Gemüse","Kräuter","Blumen","Sträucher","Obst","Sonstiges"];

// ================================================================
// FIRESTORE CRUD
// ================================================================

// Hilfsfunktion: null-Werte aus Objekt entfernen für Firestore
function cleanForFirestore(obj) {
  var out = {};
  for (var k in obj) {
    if (!Object.prototype.hasOwnProperty.call(obj,k)) continue;
    var v = obj[k];
    if (v === null || v === undefined) continue;
    if (typeof v === "object" && !Array.isArray(v)) {
      var sub = cleanForFirestore(v);
      if (Object.keys(sub).length > 0) out[k] = sub;
    } else {
      out[k] = v;
    }
  }
  return out;
}

// Pfad-Helfer
function colRef(name) { return collection(db,"users",state.user.uid,name); }
function docRef(name,id) { return doc(db,"users",state.user.uid,name,id); }

// Alle Daten laden
function ladeAlleDaten(onDone) {
  var uid = state.user.uid;
  var promises = [
    getDocs(collection(db,"users",uid,"pflanzen")),
    getDocs(collection(db,"users",uid,"beetpositionen")),
    getDocs(collection(db,"users",uid,"tagebuch")),
    getDoc(doc(db,"users",uid,"einstellungen","default"))
  ];
  Promise.all(promises).then(function(results) {
    // Schema-Migration §16: fehlende schemaVersion wird als 1 behandelt
    state.pflanzen = results[0].docs.map(function(d) {
      var data = d.data();
      if (!data.schemaVersion) data.schemaVersion = 1;
      return data;
    });
    state.beetpositionen = results[1].docs.map(function(d){ return d.data(); });
    state.tagebuch = results[2].docs.map(function(d){ return d.data(); });
    var einstellDoc = results[3];
    if (einstellDoc.exists()) {
      var eData = einstellDoc.data();
      if (eData.standort) state.einstellungen.standort = eData.standort;
    }
    onDone();
  }).catch(function(err) {
    toast("Fehler beim Laden. Bitte neu laden.");
    onDone(); // trotzdem starten mit leeren Daten
  });
}

// Pflanze speichern (anlegen + bearbeiten)
function fsSetPflanze(pflanze, onDone) {
  setDoc(docRef("pflanzen", pflanze.id), cleanForFirestore(pflanze))
    .then(function(){ if(onDone) onDone(); })
    .catch(function(err){ toast("Speichern fehlgeschlagen."); console.error(err); if(onDone) onDone(); });
}

// Pflanze löschen (inkl. Beetpositionen kaskadiert)
function fsDeletePflanze(pflanzeId, onDone) {
  var bp = state.beetpositionen.filter(function(b){ return b.pflanzeId===pflanzeId; });
  var delPromises = bp.map(function(b){ return deleteDoc(docRef("beetpositionen",b.id)); });
  delPromises.push(deleteDoc(docRef("pflanzen",pflanzeId)));
  Promise.all(delPromises)
    .then(function(){ if(onDone) onDone(); })
    .catch(function(err){ toast("Löschen fehlgeschlagen."); console.error(err); if(onDone) onDone(); });
}

// Beetposition speichern
function fsSetBeetposition(bp, onDone) {
  setDoc(docRef("beetpositionen", bp.id), cleanForFirestore(bp))
    .then(function(){ if(onDone) onDone(); })
    .catch(function(err){ toast("Speichern fehlgeschlagen."); console.error(err); if(onDone) onDone(); });
}

// Beetposition löschen
function fsDeleteBeetposition(bpId, onDone) {
  deleteDoc(docRef("beetpositionen",bpId))
    .then(function(){ if(onDone) onDone(); })
    .catch(function(err){ toast("Löschen fehlgeschlagen."); console.error(err); if(onDone) onDone(); });
}

// Tagebucheintrag speichern
function fsSetTagebuch(eintrag, onDone) {
  setDoc(docRef("tagebuch", eintrag.id), cleanForFirestore(eintrag))

}

// Tagebucheintrag löschen
function fsDeleteTagebuch(eintragId, onDone) {
  deleteDoc(docRef("tagebuch",eintragId))
    .then(function(){ if(onDone) onDone(); })
    .catch(function(err){ toast("Löschen fehlgeschlagen."); console.error(err); if(onDone) onDone(); });
}

// Einstellungen speichern
function fsSaveEinstellungen() {
  setDoc(doc(db,"users",state.user.uid,"einstellungen","default"), cleanForFirestore(state.einstellungen))
    .catch(function(err){ console.error("Einstellungen speichern:", err); });
}

// ================================================================
// AUTH + WIZARD
// ================================================================

function showAuthScreen(){
  document.getElementById("authScreen").style.display="flex";
  document.getElementById("app").style.display="none";
  renderLoginForm();
}

function renderLoginForm(){
  var content=document.getElementById("authContent");clear(content);
  var statusDiv=el("div");
  var btn=el("button",{"class":"auth-btn"},"Mit Google anmelden");
  btn.addEventListener("click",function(){
    btn.disabled=true;
    btn.textContent="Bitte warten...";
    clear(statusDiv);
    signInWithPopup(auth, googleProvider)
      .then(function(result){
        // onAuthStateChanged kümmert sich um den Rest
      })
      .catch(function(err){
        btn.disabled=false;
        btn.textContent="Mit Google anmelden";
        clear(statusDiv);
        var msg="Anmeldung fehlgeschlagen.";
        if(err.code==="auth/popup-blocked")msg="Popup wurde blockiert. Bitte Popup-Blocker deaktivieren oder erneut versuchen.";
        else if(err.code==="auth/popup-closed-by-user")msg="Anmeldung abgebrochen.";
        else if(err.message)msg=err.message;
        statusDiv.appendChild(el("div",{"class":"banner-warn"},msg));
      });
  });
  content.appendChild(el("h2",null,"Willkommen"));
  content.appendChild(el("p",null,"Melde dich mit deinem Google-Konto an um deine Pflanzendaten zu speichern."));
  content.appendChild(statusDiv);
  content.appendChild(btn);
  content.appendChild(el("div",{"class":"auth-hint"},"Nur du hast Zugang zu deinen Pflanzendaten."));
}

// ---- Standort-Wizard ----
// Wird einmalig nach dem ersten Login angezeigt.
function showLocationWizard(){
  var content=document.getElementById("authContent");clear(content);

  content.appendChild(el("h2",null,"Dein Standort"));
  content.appendChild(el("p",null,"Für Wetterdaten und Frostwarnungen benötigen wir deinen Standort."));
  var statusDiv=el("div");
  content.appendChild(statusDiv);

  // Option 1: GPS
  var gpsBtn=el("button",{"class":"location-opt"},"Standort automatisch ermitteln (GPS)");
  gpsBtn.addEventListener("click",function(){
    if(!navigator.geolocation){
      clear(statusDiv);
      statusDiv.appendChild(el("div",{"class":"banner-warn"},"GPS nicht verfügbar. Bitte Ort manuell eingeben."));
      return;
    }
    gpsBtn.disabled=true;gpsBtn.textContent="Ermittle Standort...";
    navigator.geolocation.getCurrentPosition(
      function(pos){
        state.einstellungen.standort={lat:pos.coords.latitude,lon:pos.coords.longitude,name:"Mein Standort"};
        state.einstellungen.standort.name=pos.coords.latitude.toFixed(2)+"N, "+pos.coords.longitude.toFixed(2)+"E";
            finishWizard();
      },
      function(err){
        gpsBtn.disabled=false;gpsBtn.textContent="Standort automatisch ermitteln (GPS)";
        clear(statusDiv);
        var msg="GPS nicht erlaubt.";
        if(err.code===1)msg="GPS-Zugriff verweigert. Bitte manuell eingeben oder in den Browser-Einstellungen erlauben.";
        statusDiv.appendChild(el("div",{"class":"banner-warn"},msg));
      },
      {timeout:10000}
    );
  });

  // Option 2: Manuelle Eingabe
  var manualInput=el("input",{"class":"auth-input",type:"text",placeholder:"z. B. München oder Graz",autocomplete:"off",style:"margin-top:var(--s-3)"});
  var manualBtn=el("button",{"class":"auth-btn"},"Ort bestätigen");
  manualBtn.addEventListener("click",function(){
    var ort=manualInput.value.trim();
    if(!ort){clear(statusDiv);statusDiv.appendChild(el("div",{"class":"banner-warn"},"Bitte einen Ort eingeben."));return;}
    manualBtn.disabled=true;manualBtn.textContent="Suche...";clear(statusDiv);
    // Open-Meteo Geocoding API (kostenlos, kein Key)
    fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(ort)+"&count=1&language=de&format=json")
      .then(function(r){return r.json();})
      .then(function(data){
        if(!data.results||!data.results.length){
          manualBtn.disabled=false;manualBtn.textContent="Ort bestätigen";
          clear(statusDiv);statusDiv.appendChild(el("div",{"class":"banner-warn"},"Ort nicht gefunden. Bitte anders schreiben."));
          return;
        }
        var r=data.results[0];
        state.einstellungen.standort={lat:r.latitude,lon:r.longitude,name:r.name+(r.country?" ("+r.country+")":"")};
            finishWizard();
      })
      .catch(function(){
        manualBtn.disabled=false;manualBtn.textContent="Ort bestätigen";
        clear(statusDiv);statusDiv.appendChild(el("div",{"class":"banner-warn"},"Netzwerkfehler. Bitte Verbindung prüfen oder später versuchen."));
      });
  });

  // Option 3: Überspringen
  var skipBtn=el("button",{"class":"auth-btn",style:"margin-top:var(--s-2);background:transparent;color:var(--c-leaf);border:1px solid var(--c-leaf);"},"Später einrichten");
  skipBtn.addEventListener("click",function(){finishWizard();});

  content.appendChild(el("div",{style:"display:flex;flex-direction:column;gap:8px;margin-bottom:12px;"},[gpsBtn]));
  content.appendChild(manualInput);
  content.appendChild(manualBtn);
  content.appendChild(skipBtn);
}

function finishWizard(){
  var standort=state.einstellungen.standort.name;
  if(standort) toast("Standort gesetzt: "+standort,2500);
  // Standort in Firestore speichern
  fsSaveEinstellungen();
  ladeAlleDaten(function(){
    document.getElementById("authScreen").style.display="none";
    document.getElementById("app").style.display="flex";
    buildDrawer();
    route();
  });
}

// ---- Auth State ----
onAuthStateChanged(auth,function(user){
  if(user){
      // Zugriffskontrolle: nur autorisierte E-Mail
    var ERLAUBTE_EMAIL = "joerg.kawert@icloud.com";
    if ((user.email||"").toLowerCase() !== ERLAUBTE_EMAIL.toLowerCase()) {
      signOut(auth);
      var content = document.getElementById("authContent");
      if (content) {
        clear(content);
        content.appendChild(el("h2", null, "Kein Zugriff"));
        content.appendChild(el("p", null, "Diese App ist privat. Du bist nicht berechtigt sie zu nutzen."));
      }
      return;
    }
    state.user=user;
    var email=user.email||"";
    document.getElementById("topbarUser").textContent=email;
    document.getElementById("drawerUser").textContent=email;
      ladeAlleDaten(function(){
      document.getElementById("authScreen").style.display="none";
      document.getElementById("app").style.display="flex";
      buildDrawer();
      route();
    });
  } else {
    state.user=null;
    showAuthScreen();
  }
});

var NAV_ITEMS=[
  {hash:"#/",label:"Startseite"},
  {hash:"#/pflanzen",label:"Pflanzen"},
  {hash:"#/beetkarte",label:"Beetkarte"},
  {hash:"#/tagebuch",label:"Tagebuch"},
  {hash:"#/einstellungen",label:"Einstellungen"}
];

function route(){
  var hash=location.hash.replace(/^#/,"");if(!hash)hash="/";
  var parts=hash.split("/").filter(function(s){return s!=="";});
  if(hash==="/")renderHome();
  else if(hash==="/pflanzen")renderPflanzenListe();
  else if(hash==="/pflanzen/neu")renderPflanzeForm(null);
  else if(parts[0]==="pflanzen"&&parts[1]&&parts.length===2)renderPflanzeDetail(parts[1]);
  else if(parts[0]==="pflanzen"&&parts[1]&&parts[2]==="bearbeiten")renderPflanzeForm(parts[1]);
  else if(hash==="/beetkarte")renderBeetkarte();
  else if(hash==="/tagebuch")renderTagebuchGesamt();
  else if(hash==="/einstellungen")renderEinstellungen();
  else renderHome();
  applyChrome(hash);
}

function applyChrome(hash){
  var items=document.querySelectorAll("#drawerNav .drawer__item");
  for(var i=0;i<items.length;i++){
    var h=items[i].getAttribute("data-hash");
    var active=(h===hash)||(hash.indexOf("/pflanzen")===0&&h==="/pflanzen");
    items[i].className="drawer__item"+(active?" active":"");
  }
  var fab=document.getElementById("fab");
  if(hash==="/pflanzen"){fab.hidden=false;fab.onclick=function(){location.hash="#/pflanzen/neu";};}
  else if(hash==="/tagebuch"){fab.hidden=false;fab.onclick=function(){openTagebuchForm(null,null);};}
  else{fab.hidden=true;fab.onclick=null;}
  var titles={"/":"Mein <span>Garten</span>","/pflanzen":"Pflanzen","/pflanzen/neu":"Neue Pflanze","/beetkarte":"Beetkarte","/tagebuch":"Tagebuch","/einstellungen":"Einstellungen"};
  var titleEl=document.getElementById("topbarTitle");
  if(titles[hash])titleEl.innerHTML=titles[hash];
  else if(hash.indexOf("/pflanzen/")===0&&hash.indexOf("/bearbeiten")>0)titleEl.textContent="Bearbeiten";
  else if(hash.indexOf("/pflanzen/")===0)titleEl.textContent="Pflanze";
  closeDrawer();window.scrollTo(0,0);
}

window.addEventListener("hashchange",route);

function openDrawer(){document.getElementById("drawer").className="drawer open";document.getElementById("scrim").className="drawer-scrim open";}
function closeDrawer(){document.getElementById("drawer").className="drawer";document.getElementById("scrim").className="drawer-scrim";}

function buildDrawer(){
  var nav=document.getElementById("drawerNav");clear(nav);
  for(var i=0;i<NAV_ITEMS.length;i++){
    var item=NAV_ITEMS[i];
    nav.appendChild(el("a",{"class":"drawer__item",href:item.hash,"data-hash":item.hash.replace("#","")},[el("span",null,item.label)]));
  }
  nav.appendChild(el("div",{style:"height:1px;background:var(--c-line);margin:8px 0"}));
  var logoutBtn=el("button",{"class":"drawer__item drawer__item--danger"},[el("span",null,"Abmelden")]);
  logoutBtn.addEventListener("click",function(){
    confirmModal({title:"Abmelden?",text:"Du wirst ausgeloggt.",confirmLabel:"Abmelden",danger:true,onConfirm:function(){signOut(auth).then(function(){state.user=null;state.pflanzen=[];state.tagebuch=[];});}});
  });
  nav.appendChild(logoutBtn);
}

document.getElementById("btnMenu").addEventListener("click",openDrawer);
document.getElementById("scrim").addEventListener("click",closeDrawer);

var WETTER_CACHE_MS = 60 * 60 * 1000; // 1 Stunde

// WMO weather_code → Emoji + Beschreibung (§10)
function wetterInfo(code) {
  if (code === 0) return { emoji: "☀️", desc: "Klarer Himmel" };
  if (code <= 2) return { emoji: "🌤", desc: "Teilweise bewölkt" };
  if (code === 3) return { emoji: "☁️", desc: "Bedeckt" };
  if (code <= 49) return { emoji: "🌫", desc: "Nebel" };
  if (code <= 59) return { emoji: "🌦", desc: "Nieselregen" };
  if (code <= 69) return { emoji: "🌧", desc: "Regen" };
  if (code <= 79) return { emoji: "❄️", desc: "Schneefall" };
  if (code <= 84) return { emoji: "🌧", desc: "Schauer" };
  if (code <= 94) return { emoji: "⛈", desc: "Gewitter" };
  return { emoji: "⛈", desc: "Starkes Gewitter" };
}

function ladeWetter(onDone) {
  var jetzt = Date.now();
  if (wetterCache.data && (jetzt - wetterCache.timestamp) < WETTER_CACHE_MS) {
    onDone(null, wetterCache.data);
    return;
  }
  var lat = state.einstellungen.standort.lat;
  var lon = state.einstellungen.standort.lon;
  var url = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + lat
    + "&longitude=" + lon
    + "&current=temperature_2m,precipitation,weather_code"
    + "&daily=temperature_2m_min,temperature_2m_max,precipitation_sum"
    + "&timezone=auto"
    + "&forecast_days=7";
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      wetterCache.data = data;
      wetterCache.timestamp = Date.now();
      onDone(null, data);
    })
    .catch(function(err) {
      onDone(err, null);
    });
}

// Frostwarnung: nächste 7 Tage, min < 2°C, nur winterhart===false (§8)
function pruefeFromstwarnung(wetterData) {
  if (!wetterData || !wetterData.daily) return null;
  var mins = wetterData.daily.temperature_2m_min;
  var dates = wetterData.daily.time;
  var nichtWinterhart = state.pflanzen.filter(function(p) { return p.winterhart === false; });
  if (nichtWinterhart.length === 0) return null;
  var frostTage = [];
  for (var i = 0; i < mins.length; i++) {
    if (mins[i] < 2) {
      frostTage.push({ datum: dates[i], min: mins[i] });
    }
  }
  if (frostTage.length === 0) return null;
  return { tage: frostTage, pflanzen: nichtWinterhart };
}

function formatFrostDatum(iso) {
  // iso = "2026-05-25"
  var p = iso.split("-");
  return p[2] + "." + p[1] + ".";
}

function renderHome(){
  var v=document.getElementById("view");clear(v);
  var h=new Date().getHours();
  var gruss=h<11?"Guten Morgen":h<18?"Guten Tag":"Guten Abend";
  var datumStr;try{datumStr=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});}catch(e){datumStr=new Date().toDateString();}

  v.appendChild(el("section",{"class":"hero"},[
    el("div",{"class":"hero__greeting"},gruss+"."),
    el("div",{"class":"hero__date"},datumStr)
  ]));

  // Wetter-Bereich: erst Platzhalter, dann nach Laden aktualisieren
  v.appendChild(el("div",{"class":"section-title"},"Heute in "+state.einstellungen.standort.name));
  var wetterCard = el("div",{"class":"weather-outer"});
  wetterCard.appendChild(el("div",{"class":"weather-card__loading"},"Wetterdaten laden..."));
  v.appendChild(wetterCard);

  // Hinweis-Bereich: wird nach Wetter-Laden befüllt
  var hinweisBereich = el("div");
  v.appendChild(hinweisBereich);

  v.appendChild(el("div",{"class":"section-title"},"Schnellzugriff"));
  var grid=el("div",{"class":"quick-grid"});
  grid.appendChild(quickCard("Pflanzen",state.pflanzen.length+" angelegt","#/pflanzen","🌱","pflanzen"));
  grid.appendChild(quickCard("Beetkarte","","#/beetkarte","🗺","beet"));
  grid.appendChild(quickCard("Tagebuch",state.tagebuch.length+" Einträge","#/tagebuch","📓","tagebuch"));
  v.appendChild(grid);

  // Wetter asynchron laden
  ladeWetter(function(err, data) {
    // Prüfen ob wir noch auf der Startseite sind
    if (location.hash.replace(/^#/,"") !== "/" && location.hash !== "") return;

    clear(wetterCard);
    if (err || !data || !data.current) {
      wetterCard.appendChild(el("div",{"class":"weather-card__loading"},"Wetterdaten nicht verfügbar."));
      return;
    }

    var cur = data.current;
    var daily = data.daily;
    var temp = Math.round(cur.temperature_2m);
    var info = wetterInfo(cur.weather_code);
    var tMin = daily && daily.temperature_2m_min ? Math.round(daily.temperature_2m_min[0]) : null;
    var tMax = daily && daily.temperature_2m_max ? Math.round(daily.temperature_2m_max[0]) : null;

    var details = el("div",{"class":"weather-card__details"});
    details.appendChild(el("div",{"class":"weather-card__desc"},info.desc));
    if (tMin !== null && tMax !== null) {
      details.appendChild(el("div",{"class":"weather-card__minmax"},"Min "+tMin+"° / Max "+tMax+"°"));
    }

    wetterCard.appendChild(el("div",{"class":"weather-card"},[
      el("div",{"class":"weather-card__icon"},info.emoji),
      el("div",{"class":"weather-card__temp"},temp+"°"),
      details
    ]));

    // Frostwarnung (§8)
    clear(hinweisBereich);
    var frost = pruefeFromstwarnung(data);
    if (frost) {
      var pflanzenNamen = frost.pflanzen.map(function(p){return p.name;}).join(", ");
      var erstFrost = frost.tage[0];
      var warnText = "Frost am "+formatFrostDatum(erstFrost.datum)+" ("+erstFrost.min+"°C): "+pflanzenNamen+" schuetzen.";
      if (frost.tage.length > 1) {
        warnText += " ("+frost.tage.length+" Frosttage in den nächsten 7 Tagen)";
      }
      hinweisBereich.appendChild(el("div",{"class":"section-title"},"Hinweise"));
      hinweisBereich.appendChild(el("div",{"class":"frost-banner"},[
        el("strong",null,"Achtung Frost: "),
        warnText
      ]));
    }
  });
}

// ---- Tagebucheintrag rendern (wiederverwendbar) ----
function renderTagebuchEintrag(eintrag, containerToRefresh, listEl, pflanze){
  var div=el("div",{"class":"tagebuch-eintrag"});
  var header=el("div",{"class":"tagebuch-eintrag__header"});

  var editBtn=el("button",{"class":"link-btn"},"Bearbeiten");
  var delBtn=el("button",{"class":"link-btn link-btn--danger"},"Löschen");
  editBtn.addEventListener("click",function(){
    var pflanzeId=pflanze?pflanze.id:null;
    var pflanzenName=pflanze?pflanze.name:null;
    openTagebuchForm(pflanzeId,pflanzenName,eintrag);
  });
  delBtn.addEventListener("click",function(){
    confirmModal({title:"Eintrag löschen?",confirmLabel:"Löschen",danger:true,onConfirm:function(){
      var delId=eintrag.id;
      state.tagebuch=state.tagebuch.filter(function(x){return x.id!==delId;});
      fsDeleteTagebuch(delId,function(){
        toast("Eintrag gelöscht");
        if(pflanze)renderPflanzeDetail(pflanze.id);else renderTagebuchGesamt();
      });
    }});
  });
  actions.appendChild(editBtn);actions.appendChild(delBtn);
  header.appendChild(actions);div.appendChild(header);
  div.appendChild(el("div",{"class":"tagebuch-eintrag__text"},eintrag.text||""));
  if(eintrag.fotoUrl)div.appendChild(el("img",{"class":"tagebuch-eintrag__foto",src:eintrag.fotoUrl,alt:"Foto"}));
  return div;
}

// ---- Tagebuch-Formular (Modal) ----
// pflanzeId/pflanzenName: Pflanzenzuordnung (read-only beim Bearbeiten laut §7.1)
// eintrag: null = neu anlegen, sonst bearbeiten
function openTagebuchForm(pflanzeId, pflanzenName, eintrag){
  var isEdit=!!eintrag;
  var root=document.getElementById("modalRoot");clear(root);
  function close(){clear(root);}

  var draft={
    id:isEdit?eintrag.id:uuid(),
    pflanzeId:isEdit?eintrag.pflanzeId:pflanzeId,
    pflanzenName:isEdit?eintrag.pflanzenName:pflanzenName,
    datum:isEdit?eintrag.datum:heute(),
    text:isEdit?eintrag.text:"",
    fotoUrl:isEdit?eintrag.fotoUrl:null
  };

  // Datum als drei Dropdowns (Tag / Monat / Jahr) - iOS-Safari-sicher
  var datumParts = (draft.datum||heute()).split("-");
  var dYear=datumParts[0], dMonth=datumParts[1], dDay=datumParts[2];

  function makeDatumDropdown(options, selected) {
    var s = el("select",{"class":"field input"});
    s.style.cssText = "padding:12px;border:1px solid var(--c-line-strong);border-radius:var(--r-md);background:var(--c-bg-card);color:var(--c-ink);outline:none;width:100%;font-size:16px;";
    for(var i=0;i<options.length;i++) {
      var o = el("option",{value:options[i].v, selected:options[i].v===selected},options[i].l);
      s.appendChild(o);
    }
    return s;
  }

  var tagOpts=[];for(var d=1;d<=31;d++){var ds=String(d).length<2?"0"+d:String(d);tagOpts.push({v:ds,l:String(d)});}
  var monOpts=[{v:"01",l:"Jan"},{v:"02",l:"Feb"},{v:"03",l:"Mär"},{v:"04",l:"Apr"},{v:"05",l:"Mai"},{v:"06",l:"Jun"},{v:"07",l:"Jul"},{v:"08",l:"Aug"},{v:"09",l:"Sep"},{v:"10",l:"Okt"},{v:"11",l:"Nov"},{v:"12",l:"Dez"}];
  var jahrOpts=[];var jetzt=new Date().getFullYear();for(var y=jetzt-2;y<=jetzt+1;y++){jahrOpts.push({v:String(y),l:String(y)});}

  var tagSel = makeDatumDropdown(tagOpts, dDay);
  var monSel = makeDatumDropdown(monOpts, dMonth);
  var jahrSel = makeDatumDropdown(jahrOpts, dYear);

  function updateDatum(){draft.datum=jahrSel.value+"-"+monSel.value+"-"+tagSel.value;}
  tagSel.addEventListener("change",updateDatum);
  monSel.addEventListener("change",updateDatum);
  jahrSel.addEventListener("change",updateDatum);

  var datumInput = el("div",{"class":"date-selects"},[tagSel,monSel,jahrSel]);

  var textArea=el("textarea",{style:"width:100%;padding:12px;border:1px solid var(--c-line-strong);border-radius:var(--r-md);background:var(--c-bg-card);color:var(--c-ink);outline:none;min-height:100px;resize:vertical;margin-top:var(--s-2);font-size:16px",placeholder:"Was hast du heute im Garten gemacht?"});
  textArea.value=draft.text;
  textArea.addEventListener("input",function(e){draft.text=e.target.value;});

  // Pflanzenzuordnung (read-only beim Bearbeiten, §7.1)
  var zuordnungDiv=null;
  if(draft.pflanzenName){
    zuordnungDiv=el("div",{style:"font-size:13px;color:var(--c-ink-mute);margin-bottom:var(--s-2)"},"Pflanze: "+draft.pflanzenName+(isEdit?" (nicht änderbar)":""));
  }

  var saveBtn=el("button",{"class":"btn",style:"flex:1"},isEdit?"Speichern":"Anlegen");
  saveBtn.addEventListener("click",function(){
    if(!draft.text.trim()){toast("Bitte einen Text eingeben.");return;}
    if(!draft.datum){toast("Bitte ein Datum waehlen.");return;}
    if(isEdit){
      for(var i=0;i<state.tagebuch.length;i++) if(state.tagebuch[i].id===draft.id){state.tagebuch[i]=draft;break;}
      fsSetTagebuch(draft,function(){
        toast("Eintrag gespeichert");
        close();
        var currentHash=location.hash.replace(/^#/,"");
        if(currentHash.indexOf("/pflanzen/")===0&&draft.pflanzeId) renderPflanzeDetail(draft.pflanzeId);
        else renderTagebuchGesamt();
      });
    } else {
      state.tagebuch.push(draft);
      fsSetTagebuch(draft,function(){
        toast("Eintrag angelegt");
        close();
        var currentHash=location.hash.replace(/^#/,"");
        if(currentHash.indexOf("/pflanzen/")===0&&draft.pflanzeId) renderPflanzeDetail(draft.pflanzeId);
        else renderTagebuchGesamt();
      });
    }
  });

  var cancelBtn=el("button",{"class":"btn btn--ghost",style:"flex:1"},"Abbrechen");
  cancelBtn.addEventListener("click",close);

  var scrim=el("div",{"class":"modal-scrim"});
  scrim.addEventListener("click",function(e){if(e.target===scrim)close();});
  var modalChildren=[el("h2",null,isEdit?"Eintrag bearbeiten":"Neuer Eintrag")];
  if(zuordnungDiv)modalChildren.push(zuordnungDiv);
  modalChildren.push(el("div",{"class":"field"},[el("label",null,"Datum"),datumInput]));
  modalChildren.push(el("div",{"class":"field"},[el("label",null,"Text"),textArea]));
  modalChildren.push(el("div",{"class":"modal__actions",style:"margin-top:var(--s-4)"},[cancelBtn,saveBtn]));
  scrim.appendChild(el("div",{"class":"modal"},modalChildren));
  root.appendChild(scrim);
}

  var list=el("div",{"class":"card"});
  for(var i=0;i<einträge.length;i++){
    var e=einträge[i];
    // Pflanze finden für den Kontext
    var pfl=null;if(e.pflanzeId){for(var j=0;j<state.pflanzen.length;j++)if(state.pflanzen[j].id===e.pflanzeId){pfl=state.pflanzen[j];break;}}
    var div=el("div",{"class":"tagebuch-eintrag"});

// ================================================================
// BEETKARTE
// ================================================================

// §5.1: L-Form: langer Schenkel 7.5m x 0.6m, kurzer Schenkel 1.0m x 0.6m (links unten)
// Koordinatensystem: Ursprung oben links, x nach rechts, y nach unten
// Relativer Raum: gesamte Bounding-Box = 7.5m breit, 1.6m hoch
// Langer Schenkel: x=0..7.5, y=0..0.6  → rel: x=0..1, y=0..0.375
// Kurzer Schenkel: x=0..0.6, y=0.6..1.6 → rel: x=0..0.08, y=0.375..1.0
var BEET_W_M = 7.5;   // Breite Bounding-Box in Metern
var BEET_H_M = 1.6;   // Höhe Bounding-Box (0.6 + 1.0)
// Darstellung: nicht maßstäblich, aber lesbar auf Bildschirm
// Langer Schenkel nimmt 35% der Höhe ein, kurzer Schenkel 20% der Breite
var BEET_LANG_H = 0.50;   // beide Schenkel gleich dick (nicht maßstäblich)
var BEET_KURZ_W = 0.20;   // visueller Anteil kurzer Schenkel an Gesamtbreite

// Gesamtes Rechteck ist bepflanzbar, L ist nur Orientierung
function punktImBeet(rx, ry) {
  return rx >= 0 && rx <= 1 && ry >= 0 && ry <= 1;
}

// Nummerierung: aufsteigend nach anlegedatum (§14)
function nummeriereBeetpositionen() {
  var sorted = state.beetpositionen.slice().sort(function(a,b){
    return a.anlegedatum < b.anlegedatum ? -1 : a.anlegedatum > b.anlegedatum ? 1 : 0;
  });
  // Nummer als Index+1 zuweisen (nicht persistent, nur Laufzeit)
  var numMap = {};
  for (var i = 0; i < sorted.length; i++) numMap[sorted[i].id] = i + 1;
  return numMap;
}

// Legende: pro Pflanze alle Nummern, alphabetisch nach Pflanzenname (§14)
function legendeErstellen(numMap) {
  var map = {};
  for (var i = 0; i < state.beetpositionen.length; i++) {
    var bp = state.beetpositionen[i];
    var pfl = null;
    for (var j = 0; j < state.pflanzen.length; j++) if (state.pflanzen[j].id === bp.pflanzeId) { pfl = state.pflanzen[j]; break; }
    if (!pfl) continue; // Beetposition ohne gültige Pflanze überspringen
    var name = pfl.name;
    if (!map[bp.pflanzeId]) map[bp.pflanzeId] = { name: name, nummern: [], pflanzeId: bp.pflanzeId };
    map[bp.pflanzeId].nummern.push(numMap[bp.id]);
  }
  var arr = [];
  for (var pid in map) { if (Object.prototype.hasOwnProperty.call(map, pid)) arr.push(map[pid]); }
  arr.sort(function(a,b){ return (a.name||"").localeCompare(b.name||"","de",{sensitivity:"base"}); });
  arr.forEach(function(e){ e.nummern.sort(function(a,b){return a-b;}); });
  return arr;
}

// Farbe für Beetmarker basierend auf pflanzeId
var MARKER_FARBEN = [
  "#3d5a3d", "#b8612a", "#4a7c9e", "#8b5e3c", "#6b4c8a",
  "#2e7d6b", "#c17f24", "#a83232", "#4a6741", "#7a4f6d",
  "#1a6b8a", "#c45c2a", "#5a7a3d", "#8a3d6b", "#3d7a6b",
  "#a87832", "#6b3d8a", "#2e6b4a", "#8a6b3d", "#4a3d8a",
  "#7a2e4a", "#3d6b8a", "#6b8a3d", "#8a4a2e", "#2e4a6b",
  "#7a6b2e", "#4a8a6b", "#6b2e7a", "#8a2e3d", "#3d8a4a"
];

function markerFarbe(pflanzeId) {
  // Konsistente Farbe basierend auf pflanzeId
  var hash = 0;
  for (var i = 0; i < pflanzeId.length; i++) {
    hash = ((hash << 5) - hash) + pflanzeId.charCodeAt(i);
    hash = hash & hash;
  }
  var idx = Math.abs(hash) % MARKER_FARBEN.length;
  return MARKER_FARBEN[idx];
}

// SVG der Beetkarte erstellen
// svgW: Pixelbreite des SVGs
// moving: ID der zu verschiebenden Position (oder null)
// onTap: callback(rx, ry) wenn auf freie Fläche getippt
// onMarkerLongpress: callback(bp) bei Langdruck auf Marker
function beetSVG(svgW, moving, onTap, onMarkerLongpress, filterPflanzeId) {
  var svgH = Math.round(svgW * 0.35);
  var pad = 2;
  var numMap = nummeriereBeetpositionen();

  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", svgW);
  svg.setAttribute("height", svgH + pad * 2);
  svg.setAttribute("viewBox", "0 0 " + svgW + " " + (svgH + pad * 2));
  svg.setAttribute("class","beet-svg");

  function relToSvg(rx, ry) { return { x: pad + Math.round(rx * (svgW - pad*2)), y: pad + Math.round(ry * svgH) }; }
  function svgToRel(sx, sy) { return { rx: (sx-pad) / (svgW-pad*2), ry: (sy-pad) / svgH }; }

  // L-Form mit SVG clipPath - sauberste Lösung ohne Innenlinien
  // clipPath definieren (L-Form)
  var clipId = "beet-clip-"+Math.floor(Math.random()*99999);
  var defs = document.createElementNS(svgNS, "defs");
  var cp = document.createElementNS(svgNS, "clipPath");
  cp.setAttribute("id", clipId);
  var cpPts = [
    relToSvg(0,0), relToSvg(1,0), relToSvg(1,BEET_LANG_H),
    relToSvg(BEET_KURZ_W,BEET_LANG_H), relToSvg(BEET_KURZ_W,1), relToSvg(0,1)
  ];
  var cpPoly = document.createElementNS(svgNS, "polygon");
  cpPoly.setAttribute("points", cpPts.map(function(p){return p.x+","+p.y;}).join(" "));
  cp.appendChild(cpPoly);
  defs.appendChild(cp);
  svg.appendChild(defs);

  var bg = document.createElementNS(svgNS, "rect");
  bg.setAttribute("x","0"); bg.setAttribute("y","0");
  bg.setAttribute("width", svgW); bg.setAttribute("height", svgH);
  bg.setAttribute("fill","#e8f0e8");
  bg.setAttribute("clip-path","url(#"+clipId+")");
  svg.appendChild(bg);

  var lp2 = cpPts;
  var pathD = "M"+lp2[0].x+","+lp2[0].y
    +" L"+lp2[1].x+","+lp2[1].y
    +" L"+lp2[2].x+","+lp2[2].y
    +" L"+lp2[3].x+","+lp2[3].y
    +" L"+lp2[4].x+","+lp2[4].y
    +" L"+lp2[5].x+","+lp2[5].y+" Z";
  var outline = document.createElementNS(svgNS, "path");
  outline.setAttribute("d", pathD);
  outline.setAttribute("fill","none");
  outline.setAttribute("stroke","#3d5a3d");
  outline.setAttribute("stroke-width","1.5");
  outline.setAttribute("stroke-linejoin","round");
  svg.appendChild(outline);

  // Tap auf Karte
  var tapTimer = null;
  svg.addEventListener("touchstart", function(e) {
    var touch = e.touches[0];
    var rect = svg.getBoundingClientRect();
    var sx = touch.clientX - rect.left;
    var sy = touch.clientY - rect.top;
    var rel = svgToRel(sx, sy);
    tapTimer = setTimeout(function() { tapTimer = null; }, 600); // verhindert Doppelauslösung
    e.stopPropagation();
  }, { passive: true });

  svg.addEventListener("touchend", function(e) {
    if (!tapTimer) return;
    clearTimeout(tapTimer); tapTimer = null;
    var touch = e.changedTouches[0];
    var rect = svg.getBoundingClientRect();
    var sx = touch.clientX - rect.left;
    var sy = touch.clientY - rect.top;
    var rel = svgToRel(sx, sy);
    if (punktImBeet(rel.rx, rel.ry) && onTap) onTap(rel.rx, rel.ry);
    e.preventDefault();
  }, { passive: false });

  // Click für Desktop-Test
  svg.addEventListener("click", function(e) {
    var rect = svg.getBoundingClientRect();
    var rel = svgToRel(e.clientX - rect.left, e.clientY - rect.top);
    if (punktImBeet(rel.rx, rel.ry) && onTap) onTap(rel.rx, rel.ry);
  });

  // Marker zeichnen
  var positionen = state.beetpositionen.slice();
  positionen.sort(function(a,b){ return a.anlegedatum < b.anlegedatum ? -1 : 1; });

  for (var i = 0; i < positionen.length; i++) {
    (function(bp) {
      if (filterPflanzeId && bp.pflanzeId !== filterPflanzeId) return;
      var num = numMap[bp.id];
      var pos = relToSvg(bp.x, bp.y);
      var g = document.createElementNS(svgNS, "g");
      g.setAttribute("class", "beet-marker" + (moving === bp.id ? " moving" : ""));

      var mFarbe = (moving === bp.id) ? "#b8612a" : markerFarbe(bp.pflanzeId);
      var circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", pos.x); circle.setAttribute("cy", pos.y);
      circle.setAttribute("r", "14");
      circle.setAttribute("fill", mFarbe);
      circle.setAttribute("stroke", "white");
      circle.setAttribute("stroke-width", "2");
      g.appendChild(circle);

      var text = document.createElementNS(svgNS, "text");
      text.setAttribute("x", pos.x); text.setAttribute("y", pos.y);
      text.textContent = String(num);
      g.appendChild(text);

      // Langdruck (500ms)
      if (onMarkerLongpress) {
        var pressTimer = null;
        g.addEventListener("touchstart", function(e) {
          e.stopPropagation();
          pressTimer = setTimeout(function() { pressTimer = null; onMarkerLongpress(bp); }, 500);
        }, { passive: true });
        g.addEventListener("touchend", function(e) {
          if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
          e.preventDefault();
        }, { passive: false });
        g.addEventListener("touchmove", function(e) {
          if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
        }, { passive: true });
        // Desktop: Rechtsklick oder Doppelklick als Langdruck-Ersatz
        g.addEventListener("dblclick", function(e) { e.stopPropagation(); onMarkerLongpress(bp); });
        g.addEventListener("contextmenu", function(e) { e.preventDefault(); e.stopPropagation(); onMarkerLongpress(bp); });
      }
      svg.appendChild(g);
    })(positionen[i]);
  }
  return svg;
}

// ---- Beetkarte Hauptansicht ----
var beetState = { moving: null }; // ID der zu verschiebenden Position

function renderBeetkarte() {
  var v = document.getElementById("view"); clear(v);
  beetState.moving = null;
  drawBeetkarte(v);
}

function drawBeetkarte(v) {
  clear(v);
  var numMap = nummeriereBeetpositionen();

  // Hinweis wenn im Verschiebe-Modus
  if (beetState.moving) {
    v.appendChild(el("div", {"class": "beet-hint"}, "Tippe auf die neue Position für den Marker."));
  }

  // SVG
  v.appendChild(el("div", {"class": "section-title"}, "Beet"));
  var wrap = el("div", {"class": "beet-wrap card", style:"padding:var(--s-3);overflow:hidden;"});
  var viewEl = document.getElementById("view");
  var svgW = viewEl ? Math.max(viewEl.clientWidth - 56, 200) : 280;

  var svg = beetSVG(svgW, beetState.moving,
    // onTap: neue Position oder Verschieben
    function(rx, ry) {
      if (beetState.moving) {
        // Verschieben: Position aktualisieren
        var movedBp = null;
        for (var i = 0; i < state.beetpositionen.length; i++) {
          if (state.beetpositionen[i].id === beetState.moving) {
            state.beetpositionen[i].x = rx;
            state.beetpositionen[i].y = ry;
            movedBp = state.beetpositionen[i];
            break;
          }
        }
        beetState.moving = null;
        if (movedBp) fsSetBeetposition(movedBp, null);
        toast("Position verschoben");
        drawBeetkarte(v);
      } else {
        // Neue Position: Pflanzenwahl
        pflanzeWaehlen(function(pfl) {
          var newBp = {id:uuid(),pflanzeId:pfl.id,x:rx,y:ry,anlegedatum:heute()};
          state.beetpositionen.push(newBp);
          fsSetBeetposition(newBp,null);
          toast(pfl.name + " platziert");
          drawBeetkarte(v);
        });
      }
    },
    // onMarkerLongpress: Action Sheet
    function(bp) {
      var pfl = null;
      for (var i = 0; i < state.pflanzen.length; i++) if (state.pflanzen[i].id === bp.pflanzeId) { pfl = state.pflanzen[i]; break; }
      var num = numMap[bp.id];
      var name = pfl ? pfl.name : "Position";
      actionSheet(name + " (Nr. " + num + ")", [
        { label: "Verschieben", danger: false, onSelect: function() {
          beetState.moving = bp.id;
          drawBeetkarte(v);
        }},
        { label: "Löschen", danger: true, onSelect: function() {
          confirmModal({ title: "Position löschen?", text: name + " Nr. " + num + " wird entfernt.", confirmLabel: "Löschen", danger: true, onConfirm: function() {
            var delId = bp.id;
            state.beetpositionen = state.beetpositionen.filter(function(b){ return b.id !== delId; });
            fsDeleteBeetposition(delId, null);
            toast("Position gelöscht");
            drawBeetkarte(v);
          }});
        }}
      ]);
    },
    null // kein Filter: alle Positionen zeigen
  );

  wrap.appendChild(svg);
  v.appendChild(wrap);

  // Hinweis Tippen
  if (!beetState.moving) {
    v.appendChild(el("div", {style:"font-size:12px;color:var(--c-ink-mute);text-align:center;margin-top:var(--s-2);"}, "Tippe auf das Beet um eine Pflanze zu platzieren. Langdruck auf Marker zum Verschieben oder Löschen."));
  }

  // Legende
  var legende = legendeErstellen(numMap);
  if (legende.length > 0) {
    v.appendChild(el("div", {"class": "section-title"}, "Legende"));
    var legendCard = el("div", {"class": "card"});
    var ul = el("ul", {"class": "legende"});
    for (var li = 0; li < legende.length; li++) {
      var entry = legende[li];
      var lFarbe = markerFarbe(entry.pflanzeId);
      var dot = el("div", {"class": "legende__dot", style: "background:" + lFarbe + ";"}, [el("span", null, "")]);
      var row = el("a", {
        href: "#/pflanzen/" + entry.pflanzeId,
        style: "display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) 0;border-bottom:1px solid var(--c-line);text-decoration:none;color:inherit;font-size:14px;"
      }, [
        dot,
        el("span", {"class": "legende__name"}, entry.name),
        el("span", {"class": "legende__nums"}, entry.nummern.join(", "))
      ]);
      ul.appendChild(row);
    }
    legendCard.appendChild(ul);
    v.appendChild(legendCard);
  } else if (!beetState.moving) {
    v.appendChild(el("div", {"class": "section-title"}, "Legende"));
    v.appendChild(el("div", {"class": "card"}, [el("p", {style:"color:var(--c-ink-mute);font-size:14px;margin:0"}, "Noch keine Pflanzen platziert.")]));
  }
}

// ---- BeetkarteMini (in Pflanze-Detail) ----
function renderBeetkarteMini(container, pflanzeId) {
  var positionen = state.beetpositionen.filter(function(b){ return b.pflanzeId === pflanzeId; });
  if (positionen.length === 0) {
    container.appendChild(el("div", {"class": "beet-mini"}, "Noch keine Position im Beet. Tippe auf die Beetkarte um diese Pflanze zu platzieren."));
    return;
  }
  var wrap = el("div", {"class": "beet-wrap"});
  var viewEl2 = document.getElementById("view");
  var svgW = viewEl2 ? Math.max(viewEl2.clientWidth - 64, 160) : 260;
  // Readonly Mini: kein onTap, kein Langdruck
  var svg = beetSVG(svgW, null, null, null, pflanzeId);
  wrap.appendChild(svg);
  container.appendChild(wrap);
  var numMap = nummeriereBeetpositionen();
  var nums = positionen.map(function(b){ return numMap[b.id]; }).sort(function(a,b){return a-b;});
  container.appendChild(el("div", {style:"font-size:12px;color:var(--c-ink-mute);margin-top:var(--s-2);"}, "Position" + (nums.length > 1 ? "en" : "") + ": " + nums.join(", ")));
}

function renderPlaceholder(titel,hinweis){var v=document.getElementById("view");clear(v);v.appendChild(el("div",{"class":"placeholder card"},[el("h2",null,titel),el("p",null,hinweis),el("a",{"class":"btn btn--ghost",href:"#/",style:"margin-top:16px"},"Zur Startseite")]));}

// Service Worker registrieren
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("/Main-garten/sw.js")
      .then(function(reg) { console.log("SW registriert:", reg.scope); })
      .catch(function(err) { console.log("SW Fehler:", err); });
  });
}
</script>
